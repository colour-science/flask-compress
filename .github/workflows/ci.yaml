# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python packages

on:
  pull_request:
  push:
    branches:
    - master
    tags:
    - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - 'pypy-3.12'
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # There is an issue with brotlicffi on Windows+PyPy, so we skip that combination for now.
          - os: windows-latest
            python-version: 'pypy-3.12'

    name: ${{ matrix.os }} - ${{ matrix.python-version }}
    steps:
    - name: Set git to not change line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # fetch full history
        fetch-tags: true # ensure tags are available
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        working-directory: .
        version: "0.13.4"
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install tox and tox-uv
      run: uv tool install tox --with tox-uv
    - name: Run tox
      # Run tox using the version of Python in `PATH`
      run: tox --list-dependencies -e py,coverage_report-ci -- -vv

  dist:
    runs-on: ubuntu-latest
    needs: [test]
    name: Build Python packages
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # fetch full history
        fetch-tags: true # ensure tags are available
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        working-directory: .
        version: "0.13.4"
        enable-cache: false
    - name: Build package
      run: uv build --sdist --wheel -o dist/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist

  dist_upload:
    runs-on: ubuntu-latest
    environment: pypi
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [dist]
    name: PyPI upload
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

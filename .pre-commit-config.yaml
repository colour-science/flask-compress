ci:
  autoupdate_schedule: "quarterly"

default_language_version:
  python: "python3.12"

exclude: "tests/templates/"

repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"
      - id: "end-of-file-fixer"
      - id: "mixed-line-ending"
        args:
          - "--fix=lf"
      - id: "trailing-whitespace"

  - repo: "https://github.com/asottile/pyupgrade"
    rev: "75992aaa40730136014f34227e0135f63fc951b4"  # frozen: v3.21.2
    hooks:
      - id: "pyupgrade"
        name: "Enforce Python 3.9+ idioms"
        args:
          - "--py39-plus"

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "96ae3e5802f3fe2d551e703e18f0a367d1a81ac2"  # frozen: 26.10.0
    hooks:
      - id: "black"

  - repo: "https://github.com/pycqa/flake8"
    rev: "7eccf20b526fe4f2230bf9afeeef2fc9f97faf8d"  # frozen: 7.4.1
    hooks:
      - id: "flake8"
        additional_dependencies:
          - "flake8-bugbear==24.8.19"

  - repo: "https://github.com/pre-commit/mirrors-mypy"
    rev: "2834ec6639549dd6796205c8f011dedcd587288b"  # frozen: v2.4.0
    hooks:
      - id: "mypy"
        additional_dependencies:
          - "flask>=3.0"

  - repo: "https://github.com/python-jsonschema/check-jsonschema"
    rev: "0494aa7fa1314e98913a41227d8f0a515b2c1049"  # frozen: 0.38.2
    hooks:
      - id: "check-dependabot"
      - id: "check-github-workflows"

  - repo: "https://github.com/rhysd/actionlint"
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
    hooks:
      - id: "actionlint"
